name: Daily LeetCode Tracker

on:
  schedule:
    # Runs every day at 6:15 PM UTC = 11:45 PM IST
    - cron: '15 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        run: |
          python main.py

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add input/students.xlsx
          git add output/

          git diff --cached --quiet || git commit -m "Daily LeetCode update"

          git push