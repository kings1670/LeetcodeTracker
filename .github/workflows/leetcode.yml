name: Daily LeetCode Tracker & Dashboard Deployment

on:
  schedule:
    # Runs every day at 5:25 PM UTC = 10:55 PM IST
    - cron: '25 17 * * *'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Collect LeetCode Submissions
        run: |
          python collect_submissions.py

      - name: Step 2 - Process Main Tracker & Excel
        run: |
          python main.py

      - name: Step 3 - Generate Daily Performance Report
        run: |
          python generate_daily_report.py

      - name: Step 4 - Analyze Activity Patterns
        run: |
          python analyze_activity.py

      - name: Step 5 - Export Dashboard JSON
        run: |
          python export_json.py

      - name: Step 6 - Synchronize Dashboard Datasets
        run: |
          python -c "import json, shutil, glob, os; os.makedirs('leetcode-dashboard/public/data', exist_ok=True); shutil.copy('data/activity-analysis.json', 'leetcode-dashboard/public/data/activity-analysis.json') if os.path.exists('data/activity-analysis.json') else None; shutil.copy('data/problem-cache.json', 'leetcode-dashboard/public/data/problem-cache.json') if os.path.exists('data/problem-cache.json') else None; sub_files = sorted(glob.glob('data/submissions/*.json')); shutil.copy(sub_files[-1], 'leetcode-dashboard/public/data/latest-submissions.json') if sub_files else None; shutil.copy('output/leetcode-data.json', 'leetcode-dashboard/public/data/leetcode-data.json') if os.path.exists('output/leetcode-data.json') else None"

      - name: Step 7 - Validate Generated JSON Data
        run: |
          python -c "import json, sys, os; files = ['leetcode-dashboard/public/data/leetcode-data.json', 'leetcode-dashboard/public/data/activity-analysis.json', 'leetcode-dashboard/public/data/latest-submissions.json', 'leetcode-dashboard/public/data/problem-cache.json']; [json.load(open(f, encoding='utf-8')) for f in files if os.path.exists(f)]; print('✓ JSON Data Validation Passed')"

      - name: Step 8 - Upload Daily Report to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python upload_to_drive.py

      - name: Step 9 - Commit Updated Data Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add input/students.xlsx
          git add output/
          git add reports/
          git add data/
          git add leetcode-dashboard/public/data/

          git diff --cached --quiet || git commit -m "Daily LeetCode data update - $(date +'%Y-%m-%d')"
          git push || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: leetcode-dashboard/package-lock.json

      - name: Install & Build React Dashboard
        run: |
          cd leetcode-dashboard
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'leetcode-dashboard/dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4